<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Interaktif 3D</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #e0f7fa 0%, #b2ebf2 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    /* Signature By Mario */
    .credit {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #0288d1;
      background: rgba(255, 255, 255, 0.7);
      padding: 10px 18px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      z-index: 100;
      border-left: 5px solid #0288d1;
    }

    /* Container Utama */
    .character-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 40px;
    }

    /* Speech Bubble 3D */
    .speech-bubble {
      position: absolute;
      top: -70px;
      right: -35px;
      background: linear-gradient(145deg, #ffffff, #f0f4f8);
      padding: 12px 22px;
      border-radius: 25px;
      font-weight: 800;
      font-size: 1.2rem;
      color: #0288d1;
      box-shadow: 0 10px 20px rgba(0,0,0,0.15),
                  inset 0 2px 4px rgba(255,255,255,0.8),
                  0 4px 0 #b3e5fc;
      border: 3px solid #81d4fa;
      animation: floatBounce 2.5s ease-in-out infinite alternate;
      z-index: 10;
      letter-spacing: 0.5px;
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -12px;
      left: 30px;
      border-width: 12px 10px 0;
      border-style: solid;
      border-color: #ffffff transparent;
      display: block;
      width: 0;
      filter: drop-shadow(0 3px 0 #81d4fa);
    }

    /* Badan Kalkulator 3D */
    .calculator {
      position: relative;
      background: linear-gradient(145deg, #29b6f6, #0288d1);
      padding: 24px 20px 20px;
      border-radius: 32px;
      box-shadow: 0 20px 35px rgba(2, 136, 209, 0.3),
                  inset 0 4px 6px rgba(255, 255, 255, 0.4),
                  inset 0 -4px 6px rgba(0, 0, 0, 0.2);
      width: 320px;
      border: 4px solid #b3e5fc;
      z-index: 2;
    }

    .calculator.shake {
      animation: shake 0.25s ease-in-out;
    }

    /* Wajah & Layar */
    .face-screen {
      background: #ffffff;
      border-radius: 20px;
      padding: 12px 16px 10px;
      margin-bottom: 20px;
      box-shadow: inset 0 4px 8px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* Ekspresi Joy */
    .face-expression {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 6px;
      position: relative;
    }

    .eyes-joy {
      display: flex;
      gap: 20px;
    }

    .eye-joy {
      width: 16px;
      height: 12px;
      border-top: 4px solid #263238;
      border-radius: 50% 50% 0 0;
    }

    .blush {
      position: absolute;
      top: 6px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 6px;
    }

    .blush-dot {
      width: 12px;
      height: 6px;
      background-color: #ff8a80;
      border-radius: 50%;
      opacity: 0.8;
    }

    .mouth-joy {
      width: 22px;
      height: 10px;
      border-bottom: 4px solid #263238;
      border-radius: 0 0 14px 14px;
      margin-top: 2px;
    }

    #display {
      width: 100%;
      height: 42px;
      font-size: 1.7rem;
      text-align: right;
      padding: 5px 10px;
      border: none;
      background: #e1f5fe;
      border-radius: 10px;
      color: #01579b;
      font-weight: bold;
      outline: none;
    }

    /* Grid Tombol 3D */
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      padding: 14px;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      background: linear-gradient(145deg, #ffffff, #e6e6e6);
      color: #37474f;
      box-shadow: 0 5px 0 #b0bec5, 0 8px 10px rgba(0,0,0,0.15);
      transition: all 0.1s ease;
    }

    button:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #b0bec5, 0 3px 6px rgba(0,0,0,0.15);
    }

    .btn-operator {
      background: linear-gradient(145deg, #81d4fa, #4fc3f7);
      color: #01579b;
      box-shadow: 0 5px 0 #29b6f6, 0 8px 10px rgba(0,0,0,0.15);
    }

    .btn-action {
      background: linear-gradient(145deg, #ff8a80, #ff5252);
      color: white;
      box-shadow: 0 5px 0 #d50000, 0 8px 10px rgba(0,0,0,0.15);
    }

    .btn-equal {
      background: linear-gradient(145deg, #a7ffeb, #64ffda);
      color: #004d40;
      box-shadow: 0 5px 0 #1de9b6, 0 8px 10px rgba(0,0,0,0.15);
    }

    /* Tangan Animasi */
    .hand {
      position: absolute;
      top: 85px;
      width: 38px;
      height: 38px;
      background: #ff5252;
      border-radius: 50%;
      border: 3px solid #d50000;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      z-index: 1;
    }

    .hand-left { left: -24px; }
    .hand-right {
      right: -24px;
      border-radius: 40% 50% 50% 40%;
      animation: humanWave 1.2s infinite ease-in-out;
      transform-origin: bottom left;
    }

    /* Kaki */
    .feet { display: flex; gap: 50px; margin-top: -10px; z-index: 1; }
    .foot { width: 48px; height: 22px; background: #263238; border-radius: 16px 16px 6px 6px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }

    /* Efek Partikel */
    .sparkle { position: fixed; pointer-events: none; width: 10px; height: 10px; border-radius: 50%; animation: pop 0.6s cubic-bezier(0, .9, .57, 1) forwards; z-index: 999; }

    @keyframes humanWave {
      0% { transform: rotate(0deg); }
      25% { transform: rotate(28deg) translateY(-6px); }
      50% { transform: rotate(10deg) translateY(-2px); }
      75% { transform: rotate(32deg) translateY(-8px); }
      100% { transform: rotate(0deg); }
    }

    @keyframes floatBounce {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-8px) scale(1.03); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px) rotate(-1deg); }
      40% { transform: translateX(6px) rotate(1deg); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    @keyframes pop {
      0% { opacity: 1; transform: translate(0, 0) scale(1); }
      100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0.3); }
    }
  </style>
</head>
<body>

  <!-- Signature -->
  <div class="credit">By Mario</div>

  <div class="character-container">
    <div class="speech-bubble">Hello! 👋</div>
    <div class="hand hand-left"></div>
    <div class="hand hand-right"></div>

    <div class="calculator" id="calculator">
      <div class="face-screen">
        <div class="face-expression">
          <div class="eyes-joy">
            <div class="eye-joy"></div>
            <div class="eye-joy"></div>
          </div>
          <div class="blush">
            <div class="blush-dot"></div>
            <div class="blush-dot"></div>
          </div>
          <div class="mouth-joy"></div>
        </div>
        <input type="text" id="display" readonly placeholder="0">
      </div>

      <div class="buttons">
        <button onclick="handlePress(event, 'C')" class="btn-action">C</button>
        <button onclick="handlePress(event, 'DEL')" class="btn-action">DEL</button>
        <button onclick="handlePress(event, '%')" class="btn-operator">%</button>
        <button onclick="handlePress(event, '/')" class="btn-operator">/</button>
        <button onclick="handlePress(event, '7')">7</button>
        <button onclick="handlePress(event, '8')">8</button>
        <button onclick="handlePress(event, '9')">9</button>
        <button onclick="handlePress(event, '*')" class="btn-operator">×</button>
        <button onclick="handlePress(event, '4')">4</button>
        <button onclick="handlePress(event, '5')">5</button>
        <button onclick="handlePress(event, '6')">6</button>
        <button onclick="handlePress(event, '-')" class="btn-operator">-</button>
        <button onclick="handlePress(event, '1')">1</button>
        <button onclick="handlePress(event, '2')">2</button>
        <button onclick="handlePress(event, '3')">3</button>
        <button onclick="handlePress(event, '+')" class="btn-operator">+</button>
        <button onclick="handlePress(event, '0')">0</button>
        <button onclick="handlePress(event, '.')">.</button>
        <button onclick="handlePress(event, '=')" class="btn-equal" style="grid-column: span 2;">=</button>
      </div>
    </div>

    <div class="feet">
      <div class="foot"></div>
      <div class="foot"></div>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');
    const calculator = document.getElementById('calculator');

    function handlePress(event, val) {
      triggerEffects(event);
      if (val === 'C') clearDisplay();
      else if (val === 'DEL') deleteLast();
      else if (val === '=') calculate();
      else appendValue(val);
    }

    function appendValue(value) {
      if (display.value === '0' && value !== '.') display.value = value;
      else display.value += value;
    }

    function clearDisplay() { display.value = ''; }
    function deleteLast() { display.value = display.value.slice(0, -1); }
    function calculate() {
      try {
        let expression = display.value.replace(/×/g, '*');
        display.value = eval(expression);
      } catch (error) {
        display.value = 'Error';
        setTimeout(() => clearDisplay(), 1500);
      }
    }

    function triggerEffects(e) {
      calculator.classList.remove('shake');
      void calculator.offsetWidth;
      calculator.classList.add('shake');
      const rect = e.target.getBoundingClientRect();
      const clickX = rect.left + rect.width / 2;
      const clickY = rect.top + rect.height / 2;
      const colors = ['#ff4081', '#ffd700', '#00e676', '#00b0ff', '#ff9100', '#e040fb'];
      for (let i = 0; i < 14; i++) {
        const sparkle = document.createElement('div');
        sparkle.classList.add('sparkle');
        sparkle.style.left = `${clickX}px`;
        sparkle.style.top = `${clickY}px`;
        sparkle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        const angle = Math.random() * Math.PI * 2;
        const velocity = 45 + Math.random() * 65;
        sparkle.style.setProperty('--tx', `${Math.cos(angle) * velocity}px`);
        sparkle.style.setProperty('--ty', `${Math.sin(angle) * velocity}px`);
        document.body.appendChild(sparkle);
        setTimeout(() => sparkle.remove(), 600);
      }
    }
  </script>
</body>
</html>
